ResourcePack:
  type: object
  properties:
    tag:
      type: string
      description: The tag of the resource pack
      example: minehut
    uuid:
      type: string
      description: The UUID of the resource pack
      example: 90ebe9b3-bafd-4189-9e3c-a4c4d7e6b780
    url:
      type: string
      description: The URL to the resource pack
      example: string
    hash:
      type: string
      description: The hash of the resource pack
      example: 56d83ca993eb2cc0e6f00822b1f68e5afbe1dd4a
    forced:
      type: boolean
      description: Whether the resource pack is forced
      example: false
    prompt:
      type: string
      description: The prompt message for the resource pack
      example: Please install this Minehut pack.